<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="/static/favicon.png" />
		<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
		<link rel="shortcut icon" href="/static/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="Open WebUI" />

		<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#171717" />
		<meta name="robots" content="noindex,nofollow" />
		<meta name="description" content="Open WebUI" />
		<link
			rel="search"
			type="application/opensearchdescription+xml"
			title="Open WebUI"
			href="/opensearch.xml"
		/>
		<script src="/static/loader.js" defer></script>

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('dark');
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});

				function setSplashImage() {
					const logo = document.getElementById('logo');
					const isDarkMode = document.documentElement.classList.contains('dark');

					if (isDarkMode) {
						const darkImage = new Image();
						darkImage.src = '/static/splash-dark.png';

						darkImage.onload = () => {
							logo.src = '/static/splash-dark.png';
							logo.style.filter = ''; // Ensure no inversion is applied if splash-dark.png exists
						};

						darkImage.onerror = () => {
							logo.style.filter = 'invert(1)'; // Invert image if splash-dark.png is missing
						};
					}
				}

				// Runs after classes are assigned
				window.onload = setSplashImage;
			})();
		</script>

		<title>Open WebUI</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<!-- App wrapper with menu bar and content -->
		<div id="app-wrapper" class="flex flex-col h-screen max-h-screen overflow-hidden">
			<!-- Top menu bar -->
			<div id="top-menu-bar" class="app-menu-bar">
				<div class="menu-container">
					<div class="logo-section">
						<div class="logo-wrapper">
							<img src="/static/favicon.png" alt="Logo" class="menu-logo">
						</div>
						<span class="menu-title">Sandbox <span class="tech-accent">AI.NET</span></span>
					</div>
					<div class="menu-links">
						<a href="/about" class="menu-link">About</a>
						<a href="/" class="menu-link">Sandbox</a>
						<a href="/consulting" class="menu-link">Consulting</a>
					</div>
				</div>
			</div>
			
			<!-- Main content area with auto height adjustment -->
			<div id="app-content" class="flex-1 h-0 overflow-auto">
				<div style="display: contents">%sveltekit.body%</div>
			</div>
		</div>

		<div
			id="splash-screen"
			style="position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%"
		>
			<style type="text/css" nonce="">
				html {
					overflow-y: scroll !important;
				}
			</style>

			<img
				id="logo"
				style="
					position: absolute;
					width: auto;
					height: 6rem;
					top: 44%;
					left: 50%;
					transform: translateX(-50%);
				"
				src="/static/splash.png"
			/>

			<div
				style="
					position: absolute;
					top: 33%;
					left: 50%;

					width: 24rem;
					transform: translateX(-50%);

					display: flex;
					flex-direction: column;
					align-items: center;
				"
			>
				<img
					id="logo-her"
					style="width: auto; height: 13rem"
					src="/static/splash.png"
					class="animate-pulse-fast"
				/>

				<div style="position: relative; width: 24rem; margin-top: 0.5rem">
					<div
						id="progress-background"
						style="
							position: absolute;
							width: 100%;
							height: 0.75rem;

							border-radius: 9999px;
							background-color: #fafafa9a;
						"
					></div>

					<div
						id="progress-bar"
						style="
							position: absolute;
							width: 0%;
							height: 0.75rem;
							border-radius: 9999px;
							background-color: #fff;
						"
						class="bg-white"
					></div>
				</div>
			</div>

			<!-- <span style="position: absolute; bottom: 32px; left: 50%; margin: -36px 0 0 -36px">
				Footer content
			</span> -->
		</div>
	</body>
</html>

<style type="text/css" nonce="">
	html {
		overflow-y: hidden !important;
	}

	#splash-screen {
		background: #fff;
	}

	html.dark #splash-screen {
		background: #000;
	}

	html.her #splash-screen {
		background: #983724;
	}

	#logo-her {
		display: none;
	}

	#progress-background {
		display: none;
	}

	#progress-bar {
		display: none;
	}

	html.her #logo {
		display: none;
	}

	html.her #logo-her {
		display: block;
		filter: invert(1);
	}

	html.her #progress-background {
		display: block;
	}

	html.her #progress-bar {
		display: block;
	}

	@media (max-width: 24rem) {
		html.her #progress-background {
			display: none;
		}

		html.her #progress-bar {
			display: none;
		}
	}

	@keyframes pulse {
		50% {
			opacity: 0.65;
		}
	}

	.animate-pulse-fast {
		animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
	}
	
	/* AI/Scientific themed hot menu bar styling */
	.app-menu-bar {
		background: linear-gradient(90deg, #bfbad5 0%, #807676 100%);
		box-shadow: 0 2px 12px rgba(31, 87, 255, 0.15);
		height: 64px;
		font-family: 'Archivo', system-ui, -apple-system, sans-serif;
		display: flex;
		align-items: center;
		padding: 0 16px;
		box-sizing: border-box;
		z-index: 50;
		width: 100%;
		flex-shrink: 0;
		position: relative;
		overflow: hidden;
	}
	
	/* Neural network grid pattern overlay */
	.app-menu-bar::before {
		content: "";
		position: absolute;
		top: 0;
		left: 0;
		right: 0;
		bottom: 0;
		background-image: 
			radial-gradient(circle at 10px 10px, rgba(82, 109, 255, 0.05) 2px, transparent 0),
			radial-gradient(circle at 25px 25px, rgba(82, 109, 255, 0.03) 2px, transparent 0);
		background-size: 30px 30px;
		opacity: 0.5;
		pointer-events: none;
	}
	
	html.dark .app-menu-bar {
		background: linear-gradient(90deg, #13111c 0%, #1a1b2e 100%);
		box-shadow: 0 2px 12px rgba(0, 86, 255, 0.2);
	}
	
	html.oled-dark .app-menu-bar {
		background: linear-gradient(90deg, #000000 0%, #070716 100%);
		box-shadow: 0 2px 12px rgba(0, 47, 138, 0.3);
	}
	
	html.her .app-menu-bar {
		background: linear-gradient(90deg, #6e2219 0%, #983724 100%);
		box-shadow: 0 2px 12px rgba(255, 94, 57, 0.25);
	}
	
	.menu-container {
		display: flex;
		align-items: center;
		justify-content: space-between;
		width: 100%;
		max-width: 1280px;
		margin: 0 auto;
		position: relative;
	}
	
	.logo-section {
		display: flex;
		align-items: center;
	}
	
	.logo-wrapper {
		position: relative;
		margin-right: 12px;
	}
	
	.logo-wrapper::after {
		content: "";
		position: absolute;
		top: -5px;
		left: -5px;
		right: -5px;
		bottom: -5px;
		border-radius: 50%;
		background: linear-gradient(135deg, rgba(0, 183, 255, 0.15), rgba(82, 109, 255, 0));
		z-index: -1;
		animation: pulse-subtle 3s infinite ease-in-out;
	}
	
	@keyframes pulse-subtle {
		0%, 100% { transform: scale(1); opacity: 0.5; }
		50% { transform: scale(1.1); opacity: 0.8; }
	}
	
	.menu-logo {
		height: 32px;
		filter: drop-shadow(0 0 3px rgba(0, 183, 255, 0.5));
	}
	
	.menu-title {
		font-size: 20px;
		font-weight: 600;
		color: white;
		letter-spacing: 0.5px;
		background: linear-gradient(to right, #ffffff, #a1c4fd);
		-webkit-background-clip: text;
		-webkit-text-fill-color: transparent;
		background-clip: text;
	}
	
	.tech-accent {
		background: linear-gradient(to right, #00c6ff, #0072ff);
		-webkit-background-clip: text;
		-webkit-text-fill-color: transparent;
		background-clip: text;
	}
	
	html.dark .tech-accent {
		background: linear-gradient(to right, #00c6ff, #0072ff);
		-webkit-background-clip: text;
		-webkit-text-fill-color: transparent;
	}
	
	html.oled-dark .tech-accent {
		background: linear-gradient(to right, #00c6ff, #0072ff);
		-webkit-background-clip: text;
		-webkit-text-fill-color: transparent;
	}
	
	html.her .tech-accent {
		background: linear-gradient(to right, #ffcc33, #ff5e39);
		-webkit-background-clip: text;
		-webkit-text-fill-color: transparent;
	}
	
	.menu-links {
		display: flex;
		gap: 12px;
	}
	
	.menu-link {
		text-decoration: none;
		color: rgba(255, 255, 255, 0.8);
		font-size: 14px;
		font-weight: 500;
		padding: 8px 16px;
		border-radius: 6px;
		transition: all 0.3s ease;
		position: relative;
		letter-spacing: 0.5px;
		backdrop-filter: blur(10px);
		border: 1px solid rgba(255, 255, 255, 0.05);
	}
	
	.menu-link::before {
		content: "";
		position: absolute;
		top: 0;
		left: 0;
		right: 0;
		bottom: 0;
		border-radius: 6px;
		background: linear-gradient(135deg, rgba(82, 109, 255, 0.15), rgba(0, 183, 255, 0.05));
		opacity: 0;
		transition: opacity 0.3s ease;
	}
	
	.menu-link:hover {
		color: rgba(255, 255, 255, 1);
		box-shadow: 0 2px 10px rgba(0, 183, 255, 0.15);
		transform: translateY(-1px);
		border: 1px solid rgba(82, 109, 255, 0.3);
	}
	
	.menu-link:hover::before {
		opacity: 1;
	}
	
	html.her .menu-link:hover {
		box-shadow: 0 2px 10px rgba(255, 94, 57, 0.25);
		border: 1px solid rgba(255, 204, 51, 0.3);
	}
	
	html.her .menu-link::before {
		background: linear-gradient(135deg, rgba(255, 204, 51, 0.15), rgba(255, 94, 57, 0.05));
	}
	
	@media (max-width: 600px) {
		.app-menu-bar {
			height: 58px;
		}
		
		.menu-title {
			font-size: 18px;
		}
		
		.menu-links {
			gap: 8px;
		}
		
		.menu-link {
			padding: 6px 12px;
			font-size: 13px;
		}
		
		.logo-wrapper::after {
			display: none;
		}
	}
	
	/* Complete height adjustment fix */
	html, body {
		height: 100% !important;
		margin: 0 !important;
		padding: 0 !important;
		overflow: hidden !important;
	}
	
	#app-wrapper {
		display: flex !important;
		flex-direction: column !important;
		height: 100vh !important;
		max-height: 100vh !important;
		width: 100% !important;
		overflow: hidden !important;
		position: relative !important;
	}
	
	#app-content {
		flex: 1 0 auto !important;
		height: calc(100vh - 64px) !important;
		max-height: calc(100vh - 64px) !important;
		position: relative !important;
		overflow-y: auto !important;
		overflow-x: hidden !important;
	}
	
	/* Fix for any SvelteKit content wrappers */
	#app-content > div, 
	#app-content > div > div,
	#app-content [data-sveltekit-root] {
		height: 100% !important;
		max-height: 100% !important;
		display: flex !important;
		flex-direction: column !important;
		min-height: 0 !important;
	}
	
	/* Fix for common WebUI components */
	#app-content .h-screen,
	#app-content .min-h-screen,
	#app-content .max-h-screen,
	#app-content [class*="h-[100vh]"],
	#app-content [class*="min-h-[100vh]"],
	#app-content [class*="max-h-[100vh]"] {
		height: 100% !important;
		min-height: 0 !important;
		max-height: 100% !important;
	}
	
	/* Responsive settings */
	@media (max-height: 600px) {
		.app-menu-bar {
			height: 50px !important;
		}
		
		#app-content {
			height: calc(100vh - 50px) !important;
			max-height: calc(100vh - 50px) !important;
		}
	}
	
	/* Mobile fix */
	@supports (-webkit-touch-callout: none) {
		body, #app-wrapper {
			height: -webkit-fill-available !important;
			max-height: -webkit-fill-available !important;
		}
		
		#app-content {
			height: calc(-webkit-fill-available - 64px) !important;
			max-height: calc(-webkit-fill-available - 64px) !important;
		}
		
		@media (max-height: 600px) {
			#app-content {
				height: calc(-webkit-fill-available - 50px) !important;
				max-height: calc(-webkit-fill-available - 50px) !important;
			}
		}
	}

	/* Add this script to fix any dynamic height issues after page load */
	document.addEventListener('DOMContentLoaded', function() {
		// Ensure content properly fills the available space
		function adjustContentHeight() {
			const menuHeight = document.getElementById('top-menu-bar').offsetHeight;
			const content = document.getElementById('app-content');
			content.style.height = `calc(100vh - ${menuHeight}px)`;
			content.style.maxHeight = `calc(100vh - ${menuHeight}px)`;
		}
		
		// Initial adjustment
		adjustContentHeight();
		
		// Adjust on resize
		window.addEventListener('resize', adjustContentHeight);
	});
</style>
